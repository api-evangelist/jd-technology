    public cloud — compute (VM), storage, databases (RDS), networking, containers,
    CDN, AI and security services. Each product exposes REST operations at a per-service
    host (<service>.jdcloud-api.com) authenticated with an access-key / secret-key
    request signature; the jdc CLI and language SDKs wrap the same OpenAPI.'
