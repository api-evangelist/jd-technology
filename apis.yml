name: JD Technology
description: 'JD Technology Group (京东科技集团) is the technology and cloud subsidiary of
  JD.com, delivering digital-transformation services to government, financial institutions,
  and enterprises. Its primary developer surface is JD Cloud (京东云), a full-stack public
  cloud offering compute, storage, databases, networking, AI, security, and industry
  solutions exposed through the JD Cloud OpenAPI. Developers integrate via signed
  (access-key / secret-key) OpenAPI calls to per-service endpoints, and JD Technology
  publishes first-party SDKs for Java, Go, Python, PHP, .NET, Node.js and iOS plus
  a cross-platform command line (jdc) on GitHub. This profile was surfaced as a portfolio
  company of hongshan and enriched from JD Technology''s public developer surfaces.'
